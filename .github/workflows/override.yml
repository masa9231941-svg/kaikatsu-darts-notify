name: override

# 通知の手動 ON/OFF トグル。
#  - GitHub アプリ/ブラウザの Actions 画面から "Run workflow"
#  - もしくは HTTP Shortcuts 等から workflow_dispatch を POST
on:
  workflow_dispatch:
    inputs:
      action:
        description: "通知を on / off"
        type: choice
        options: ["on", "off"]
        default: "on"
      hours:
        description: "on の持続時間(時間)。空欄なら config の override_hours"
        default: "3"

concurrency:
  group: poll            # poll.yml と直列化（同じ data/ を触るため）
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  override:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set toggle
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_HOURS: ${{ inputs.hours }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python3 set_override.py

      - name: Poll now (on のときだけ即チェック)
        if: ${{ inputs.action == 'on' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python3 poll.py

      - name: Commit
        run: |
          git config user.name  "darts-bot"
          git config user.email "darts-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "override ${{ inputs.action }} ${{ github.run_id }} [skip ci]"
            git pull --rebase --autostash
            git push
          fi
